name: modernorm-observability-prototype
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18889:8889"
    depends_on: [victoriametrics]
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command: ["-storageDataPath=/storage", "-retentionPeriod=1d"]
    volumes: ["metrics:/storage"]
    ports: ["127.0.0.1:18428:8428"]
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: local-prototype-only
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
    depends_on: [victoriametrics]
volumes:
  metrics:
