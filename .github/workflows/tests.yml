name: Tests

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHPStan and PSR-12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_mysql, ctype, iconv, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install optional SDK for adapter analysis
        run: composer install --working-dir=examples/observability --no-interaction --prefer-dist --no-progress
      - run: composer quality
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        symfony: ['locked', '7.4', '8.1']
        postgresql: ['17', '18', '19']
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
      MODERNORM_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/modernorm_test
      MODERNORM_TEST_MYSQL_URL: mysql://root:modernorm@127.0.0.1:3306/mysql
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: modernorm
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmodernorm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: modernorm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_mysql, ctype, iconv, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Select Symfony release line
        if: matrix.symfony != 'locked'
        env:
          SYMFONY_VERSION: ${{ matrix.symfony }}
        run: |
          php tools/ci/select-symfony.php
          composer update 'symfony/*' --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer validate --strict

      - name: Check installed platform requirements
        run: composer check-platform-reqs

      - name: Unit, PostgreSQL and MySQL import integration tests
        run: composer test -- --fail-on-skipped --exclude-group advanced-schema-core

      - name: Migrations and fixtures from an empty schema
        run: php examples/migrations-fixtures/run.php

      - name: Optional OpenTelemetry adapter tests
        if: matrix.symfony == 'locked'
        run: |
          composer install --working-dir=examples/observability --no-interaction --prefer-dist --no-progress
          php vendor/bin/phpunit --bootstrap examples/observability/bootstrap.php examples/observability/tests --fail-on-skipped

      - name: Install production dependencies only
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      - name: Runtime without optional development packages
        run: php tests/Smoke/runtime.php

  core-compatibility:
    name: Core beta.5 / PHP ${{ matrix.php }} / PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        postgresql: ['17', '18', '19']
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
      MODERNORM_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/modernorm_test
      MODERNORM_TEST_MYSQL_URL: mysql://root:modernorm@127.0.0.1:3306/mysql
      MODERNORM_CORE_PATH: ${{ github.workspace }}/modernorm-core
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: modernorm
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmodernorm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: modernorm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact core compatibility revision
        uses: actions/checkout@v4
        with:
          repository: andreybolonin/modernorm
          ref: 15db53058e10fa1fcd3ad7464c7531cb2a131600
          path: modernorm-core
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_mysql, ctype, iconv, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Bundle suite against the pinned core
        run: php vendor/bin/phpunit --bootstrap tools/core-compatibility/bootstrap.php --fail-on-skipped --exclude-group advanced-schema-core
      - name: FTS migrations and saved Profiler compatibility
        run: php vendor/bin/phpunit --bootstrap tools/core-compatibility/bootstrap.php tools/core-compatibility/tests --fail-on-skipped
      - name: SDK and OTLP adapter compatibility
        run: |
          composer install --working-dir=examples/observability --no-interaction --prefer-dist --no-progress
          php vendor/bin/phpunit --bootstrap examples/observability/bootstrap.php examples/observability/tests tools/core-compatibility/otel --fail-on-skipped
      - name: Static analysis against pinned core
        run: composer analyse:core
      - name: Checkout advanced PostgreSQL schema core
        uses: actions/checkout@v4
        with:
          repository: andreybolonin/modernorm
          ref: 910c9c0da927c40b375054df96577d5a4790ba57
          path: modernorm-schema-core
          persist-credentials: false
      - name: Trigger and advanced schema migrations
        env:
          MODERNORM_CORE_PATH: ${{ github.workspace }}/modernorm-schema-core
        run: php vendor/bin/phpunit --bootstrap tools/core-compatibility/bootstrap.php --fail-on-skipped --group advanced-schema-core
      - name: Migrations with the minimum supported Doctrine Migrations version
        env:
          MODERNORM_CORE_PATH: ${{ github.workspace }}/modernorm-schema-core
          SYMFONY_VERSION: '7.4'
        run: |
          php tools/ci/select-symfony.php
          composer update 'symfony/*' doctrine/migrations:3.9.1 --with-all-dependencies --no-interaction --prefer-dist --no-progress
          php -r 'require "vendor/autoload.php"; exit(Composer\InstalledVersions::getVersion("doctrine/migrations") === "3.9.1.0" ? 0 : 1);'
          php -d auto_prepend_file=tools/core-compatibility/bootstrap.php examples/migrations-fixtures/run.php
          php vendor/bin/phpunit --bootstrap tools/core-compatibility/bootstrap.php --fail-on-skipped tests/SchemaIntegrationTest.php
